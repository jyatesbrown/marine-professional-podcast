number: 1
title: 'From Generator to Instrument: How a Research Vessel Manages Electrical Power'
slug: research-vessel-power
track: Marine Engineering
subject: Shipboard electrical power generation and distribution
target_minutes: 15.0
learning_objectives:
- Explain the prime mover → alternator → main switchboard → distribution → equipment chain.
- Distinguish generator speed/frequency control from excitation/voltage control.
- Describe the role of breakers, transformers, and UPS equipment.
- Explain at a high level why generator paralleling demands synchronization.
- Differentiate normal ship service power, shore power, and an emergency source.
- Respond appropriately to a vessel power casualty by prioritizing safety and authorized procedures rather
  than ad hoc switching.
prerequisites:
- Basic AC circuit concepts (voltage, current, frequency)
- General familiarity with vessel machinery spaces
references:
- 'OSHA, Electrical Circuits and Distribution Boards: https://www.osha.gov/etools/shipyard/general-requirements/electrical-circuits'
- 'USCG Marine Safety Center, Ship Service Generator/Switchboard guidance: https://www.dco.uscg.mil/Portals/9/MSC/PRG/PRG.E2-21.2010.06.07.Ship_Service_Generator_Switchboard.pdf'
- 'Massachusetts Maritime Academy, Electrical Distribution System: https://weh.maritime.edu/campus/TSPS/manual/elecGen.html'
- 'USCG Marine Safety Center, Electrical Distribution System review: https://www.dco.uscg.mil/Portals/9/OCSNCOE/References/MSC-Guidance/PRGs/PRG-E2-07-2021.10.13.pdf'
- 'Norbert Doerry, Marine Electrical Power Systems, Real and Reactive Power Sharing: https://doerry.org/norbert/MarineElectricalPowerSystems/fundamentals/0160/index.htm'
- '46 CFR 129.390 (OSV shore power, example of specific applicability): https://www.law.cornell.edu/cfr/text/46/129.390'
review_questions:
- Which components between a ship-service generator and a lab instrument could interrupt its power?
- 'Frequency sags when a large load starts: why is a defective voltage regulator not the first assumption?'
- If normal power is lost, which research-lab loads receive emergency power?
- Why must an incoming generator be synchronized before its breaker closes?
- What is the difference between real, reactive, and apparent power?
pronunciation_notes:
- ADCP = A-D-C-P
- UPS = U-P-S
- HVAC = H-VAC (aitch-vac)
- kilovolt-amperes reactive
- ship-service switchboard
- synchronization / synchronism
