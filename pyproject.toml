[project]
name = "marinepod"
version = "0.1.0"
description = "Two-speaker educational podcast pipeline for The Marine Professional (ElevenLabs Text to Dialogue)"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27,<1",
  "pyyaml>=6,<7",
  "pydantic>=2.5,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mpod = "marinepod.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
